# Starts only the PostgreSQL database for local development.
#   docker compose up -d
# Then run the Go server with:
#   DATABASE_URL=postgres://crm:crm@localhost:5432/crm?sslmode=disable
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    ports:
      - "5432:5432"
    volumes:
      - crm-data:/var/lib/postgresql/data

volumes:
  crm-data:
